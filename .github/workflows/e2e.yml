# CI for the SvelteKit app, which still serves frunk.cloud from Cloudflare.
#
# Two changes on 2026-09-03, after this workflow twice rewrote the live database's
# schema from branches that are not the SvelteKit app:
#
#   1. It is scoped to `main` and to pull requests targeting `main`. It used to run
#      `on: push` with no filter, so it ran on every branch in the repo — including
#      the Astro port branch, where `drizzle.config.ts` resolves to a *different*
#      schema.
#   2. The `drizzle-kit push --force` step is gone. An automatically-triggered
#      workflow must not migrate a database. Schema changes go through
#      `db-migrate.yml`, which is manual and confirms the target first.
#
# What happened: the port branch's schema was applied to the legacy database (making
# `user.password_hash` nullable and adding a cascade to `session.user_id`), and a
# later run from another branch reverted it. Nothing was lost — the daily backups
# confirm the schema is unchanged from before — but the schema was whipsawing
# between branches, and the next branch to differ could have done real damage.
name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm build

      - name: Run e2e tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run test:regression

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
