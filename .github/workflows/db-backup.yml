# Nightly pg_dump of the production branch into the private backup repo.
#
# The one scheduled workflow allowed near a database, because it only reads. It takes the
# connection string from the `database` environment — the same ASTRO_DATABASE_URL that the
# manual migrate workflow uses — so there is exactly one place that knows where production
# is. (Until 2026-09-21 this dumped the legacy Cloudflare-era database through a separate
# DATABASE_URL secret; that database is retired with the Cloudflare project.)
name: Daily DB Backup

on:
  schedule:
    - cron: '0 6 * * *' # 6 AM UTC daily
  workflow_dispatch: # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BACKUP_REPO: mark-mcdermott/frunk-daily-backups

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: database

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.ASTRO_DATABASE_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-acl --clean --if-exists > backup.sql
          echo "Backup size: $(wc -c < backup.sql) bytes"

      - name: Clone backup repo
        run: |
          git clone https://x-access-token:${{ secrets.FRUNK_BACKUP_REPO_TOKEN }}@github.com/${{ env.BACKUP_REPO }}.git backup-repo

      - name: Commit and push backup
        run: |
          cd backup-repo
          cp ../backup.sql frunk-$(date -u +%Y-%m-%d).sql
          cp ../backup.sql latest.sql
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to backup" && exit 0
          git commit -m "backup $(date -u +%Y-%m-%d-%H%M)"
          git push
