# Applies the schema to a database from a phone.
#
# Run it from the Actions tab (or the GitHub mobile app): Run workflow → pick the
# target → Run. Nothing is installed locally and the connection string never leaves
# GitHub Secrets.
#
# Set the secret once, at Settings → Secrets and variables → Actions:
#   ASTRO_DATABASE_URL   the connection string for the Astro port's NEW, BLANK database
#
# ⚠️ Deliberately NOT `DATABASE_URL`. That secret already exists in this repository and
# feeds `db-backup.yml`, which dumps the LEGACY database still serving frunk.cloud from
# Cloudflare. Pointing a schema push at it would rewrite the live app's schema. The two
# databases must never share a secret name.
#
# This never runs on git push. A migration is a deliberate act, not a side effect of a
# deploy — Vercel builds must not carry it.
#
# `seed-office` is also here, for the same reason: the production connection string is
# Sensitive on Vercel and cannot be read back, so this workflow is the only path from a
# laptop to a seeded production template garage. The seed clears its own fixtures first,
# so re-running it is safe.
name: Database migrate

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        default: status
        type: choice
        options:
          - status # connect and report what is there, change nothing
          - push # apply the schema, then seed roles
          - seed-office # seed roles, then the Office fixtures (Creed is the demo template)
      confirm:
        description: Type the database name to allow a write (ignored for "status")
        required: false
        type: string

concurrency: database-migrate

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: database

    steps:
      - uses: actions/checkout@v4

      # The db:* scripts belong to the Astro app. A ref without it (an old SvelteKit-era
      # branch) would apply the wrong schema from the wrong config.
      - name: Refuse to run without the Astro app
        run: |
          if [ ! -f astro.config.mjs ]; then
            echo "::error::No astro.config.mjs on ${{ github.ref_name }} — wrong branch."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Checked for every action: an unset secret makes `pg` dial localhost and the failure
      # reads as a network error rather than the configuration gap it is.
      - name: Refuse to run without the connection string
        env:
          DATABASE_URL: ${{ secrets.ASTRO_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::ASTRO_DATABASE_URL is not set on the 'database' environment. See the header of this file."
            exit 1
          fi

      - name: Guard a write behind a typed confirmation
        if: inputs.action != 'status'
        env:
          DATABASE_URL: ${{ secrets.ASTRO_DATABASE_URL }}
        run: |
          name="$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).pathname.split("?")[0].slice(1))')"
          if [ "${{ inputs.confirm }}" != "$name" ]; then
            echo "::error::Type the database name in the confirm box to run a write."
            echo "Run this workflow with action=status first — it prints the name."
            exit 1
          fi

      - name: Report current state
        env:
          DATABASE_URL: ${{ secrets.ASTRO_DATABASE_URL }}
        run: |
          node --input-type=module -e "
            import pg from 'pg';
            const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            // The host names the Neon branch (CLAUDE.md lists both endpoints); it is not a secret.
            console.log('Host:', new URL(process.env.DATABASE_URL).hostname);
            console.log('Database:', (await c.query('select current_database()')).rows[0].current_database);
            const t = await c.query(\"select table_name from information_schema.tables where table_schema='public' order by 1\");
            console.log('Tables:', t.rows.length ? t.rows.map(r => r.table_name).join(', ') : '(none)');
            const hasRoles = t.rows.some(r => r.table_name === 'roles');
            if (hasRoles) {
              const r = await c.query('select id, name from roles order by id');
              console.log('Roles:', r.rows.length ? r.rows.map(x => x.id + '=' + x.name).join(', ') : '(none)');
            }
            if (t.rows.some(r => r.table_name === 'user')) {
              const u = await c.query('select count(*)::int as n, bool_or(email = \\'creed.bratton@dundermifflin.com\\') as template from \"user\"');
              console.log('Users:', u.rows[0].n, '— demo template present:', u.rows[0].template);
            }
            await c.end();
          "

      - name: Apply schema
        if: inputs.action == 'push'
        env:
          DATABASE_URL: ${{ secrets.ASTRO_DATABASE_URL }}
        run: pnpm db:push --force

      - name: Seed roles
        if: inputs.action != 'status'
        env:
          DATABASE_URL: ${{ secrets.ASTRO_DATABASE_URL }}
        run: pnpm db:seed-roles

      - name: Seed the Office fixtures
        if: inputs.action == 'seed-office'
        env:
          DATABASE_URL: ${{ secrets.ASTRO_DATABASE_URL }}
        run: pnpm db:seed-office

      - name: Report new state
        if: inputs.action != 'status'
        env:
          DATABASE_URL: ${{ secrets.ASTRO_DATABASE_URL }}
        run: |
          node --input-type=module -e "
            import pg from 'pg';
            const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await c.connect();
            const t = await c.query(\"select table_name from information_schema.tables where table_schema='public' order by 1\");
            const r = await c.query('select id, name from roles order by id');
            console.log('Tables:', t.rows.map(x => x.table_name).join(', '));
            console.log('Roles:', r.rows.map(x => x.id + '=' + x.name).join(', '));
            await c.end();
          "
