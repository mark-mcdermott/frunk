# CI for the Astro port.
#
# This replaces `e2e.yml` on this branch. That workflow ran on every push to every
# branch and included `npx drizzle-kit push --force` against `secrets.DATABASE_URL` —
# which is the LEGACY database. On this branch that meant CI was applying the port's
# schema to the live app's database. It did exactly that on 2026-09-03; see
# docs/PORT-PLAN.md, "An accident worth recording".
#
# Nothing here touches a *deployed* database. The test job runs against a throwaway
# Postgres service container, created and destroyed with the job — it holds no secret
# and cannot reach Neon at all, which is the property that matters after the accident
# above. Migrations still belong in `db-migrate.yml`: manual, separate secret, refuses
# to run from `main`.
#
# Decision 11 suggested a Neon branch per run. A service container is used instead: it
# needs no Neon credentials in CI, and `getDb()` already picks node-postgres over
# Neon's HTTP driver from the URL host, so the same handlers are exercised either way.
#
# The browser journeys (`tests/e2e/`, Playwright, chromium only) run in the `e2e`
# job against the same kind of throwaway container. The upload journeys need the
# private Blob store's token and skip without it — deliberately: no store token lives
# in CI. They run locally, where `tests/run.sh` exports it from `.env.local`.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # `tests/run.sh` builds its own URL from these; nothing here is a secret.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DB: frunk_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: API integration tests
        run: pnpm test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DB: frunk_e2e

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Browser journeys
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
